name: Test-workflow-stuff
run-name: Actions testing
on: workflow_dispatch
jobs:
  test-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Grab source file
        run: curl -L "https://github.com/{ github.repository }/releases/download/source/source.json"
      
      - run: |
          MARKETING_VERSION=$(grep -m1 'MARKETING_VERSION =' JESSI.xcodeproj/project.pbxproj \
            | sed 's/.*MARKETING_VERSION = \(.*\);/\1/')

          BUILD_NUMBER=$(grep -m1 'CURRENT_PROJECT_VERSION =' JESSI.xcodeproj/project.pbxproj \
            | sed 's/.*CURRENT_PROJECT_VERSION = \(.*\);/\1/')
            
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
      - run: |
          echo "Version: $MARKETING_VERSION"
          echo "Build: $BUILD_NUMBER"
