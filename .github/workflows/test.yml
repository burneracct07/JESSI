name: Test-workflow-stuff
run-name: Actions testing
on: workflow_dispatch
jobs:
  test-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Do everything lol
        run: curl -L -s https://github.com/${{ github.repository }}/releases/download/source/source.json | jq --arg version $(grep -m1 'MARKETING_VERSION =' JESSI.xcodeproj/project.pbxproj | sed 's/.*MARKETING_VERSION = \(.*\);/\1/') --arg date $(date -I) --arg size $(curl -L -s https://github.com/${{ github.repository }}/releases/latest/download/JESSI.ipa | wc -c) '.apps[].versions[].version = $version | .apps.[].versions[].date = $date | .apps[].versions[].size = ($size | tonumber)'
